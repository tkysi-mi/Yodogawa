name: CI

# PR とブランチ push で品質ゲート（markdownlint）を実行する。
# release.yml（タグ push で npm publish）とは責務を分離する。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint:md

      # package.json を編集して plugin.json/marketplace.json の同期を忘れた PR を落とす。
      - name: Check plugin manifests are in sync with package.json
        run: node scripts/sync-plugin-manifests.mjs --check
